name: Update sheet

# Times are UTC. 17:13 and 23:13 UTC = 9:13 AM and 3:13 PM Pacific (standard time); 07:47 UTC = 11:47 PM Pacific.
on:
  schedule:
    - cron: "13 17 * * *"
    - cron: "13 23 * * *"
    - cron: "47 7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh (pull and score) or grade (score finished games)"
        type: choice
        options: [refresh, grade]
        default: refresh

permissions:
  contents: write

concurrency:
  group: sheet
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the pipeline
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "47 7 * * *" ]; then MODE=grade; else MODE=refresh; fi
          fi
          echo "Mode: $MODE"
          python pipeline/run.py "$MODE"
      - name: Save the new data
        run: |
          git config user.name "sheet-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if [ -f props.json ]; then git add props.json; fi
          if [ -f results.json ]; then git add results.json; fi
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Update data" && git push; fi
