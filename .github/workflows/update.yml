name: Update sheet

# Times are UTC (Pacific standard time is UTC-8). GitHub often starts scheduled runs 10-40 minutes late.
#   :13 every hour from 15:00 to 04:00 UTC (7 AM to 8 PM Pacific): refresh
#   :43 from 22:00 to 04:00 UTC every day: extra refreshes before NBA tip-offs
#   :43 from 16:00 to 21:00 UTC on Sundays: extra refreshes before the NFL afternoon games
#   07:47 UTC (11:47 PM Pacific): grade
on:
  schedule:
    - cron: "13 0-4,15-23 * * *"
    - cron: "43 0-4,22,23 * * *"
    - cron: "43 16-21 * * 0"
    - cron: "47 7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh (pull and score) or grade (score finished games)"
        type: choice
        options: [refresh, grade]
        default: refresh

permissions:
  contents: write

concurrency:
  group: sheet
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the pipeline
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "47 7 * * *" ]; then MODE=grade; else MODE=refresh; fi
          fi
          echo "Mode: $MODE"
          python pipeline/run.py "$MODE"
      - name: Save the new data
        run: |
          git config user.name "sheet-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if [ -f props.json ]; then git add props.json; fi
          if [ -f results.json ]; then git add results.json; fi
          if [ -f calib.json ]; then git add calib.json; fi
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Update data" && (git push || (git pull --rebase -X theirs && git push)); fi
